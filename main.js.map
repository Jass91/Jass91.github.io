<div class="form-container">
  <mat-stepper [linear]="true" #stepper>
    <!-- Step 1 -->
    <mat-step [stepControl]="stepOneForm" label="Connect your wallet">
      <form [formGroup]="stepOneForm">
        <div class="full-field">
          <mat-form-field>
            <input
              matInput
              [readonly]="true"
              formControlName="wallet"
              placeholder="Will be filled once you connect"
            />
            <button
              matSuffix
              mat-icon-button
              (click)="connectWallet($event)"
              style="margin-right: 10px"
            >
              <mat-icon svgIcon="metamask"></mat-icon>
            </button>
          </mat-form-field>
          <div class="button-area">
            <mat-radio-group
              aria-label="Select an profile"
              formControlName="profile"
            >
              <mat-radio-button value="Player">Player</mat-radio-button>
              <mat-radio-button value="GameOwner">Owner</mat-radio-button>
            </mat-radio-group>
            <button mat-button matStepperNext [disabled]="!stepOneForm.valid">
              Next
            </button>
          </div>
        </div>
      </form>
    </mat-step>

    <!-- Step 2 -->
    <mat-step [stepControl]="stepTwoForm">
      <form [formGroup]="stepTwoForm">
        <ng-template matStepLabel>Personal Information</ng-template>
        <div class="full-field">
          <mat-form-field>
            <mat-label>Tell us your Tax ID</mat-label>
            <input matInput formControlName="taxId" required />
          </mat-form-field>

          <mat-form-field>
            <mat-label>Tell us your name</mat-label>
            <input matInput formControlName="name" required />
          </mat-form-field>

          <mat-form-field>
            <mat-label>Email</mat-label>
            <input
              matInput
              placeholder="Email"
              formControlName="email"
              required
            />
          </mat-form-field>
        </div>

        <div class="action-container">
          <button mat-button matStepperPrevious [disabled]="!stepTwoForm.valid">
            Back
          </button>
          <button mat-button matStepperNext>Next</button>
        </div>
        <div style="margin-top: 10px" *ngIf="signupError" class="error">
          {{ signupError }}
        </div>
      </form>
    </mat-step>

    <mat-step>
      <ng-template matStepLabel>Signature</ng-template>
      <p>You are almost done.</p>
      <p>Please we just need you to sign a message using your wallet</p>
      <form [formGroup]="signatureForm" style="width: 100%">
        <mat-form-field style="width: 100%">
          <mat-label>Signature</mat-label>
          <input matInput required readonly formControlName="signature" />
        </mat-form-field>
      </form>
      <div class="action-container">
        <button mat-button matStepperPrevious>Back</button>
        <button mat-button (click)="sign()">Sign</button>
        <button
          mat-button
          (click)="submit()"
          [disabled]="
            !stepOneForm.valid || !stepTwoForm.valid || !signatureForm.valid
          "
        >
          Send
        </button>
      </div>
    </mat-step>
  </mat-stepper>
</div>
