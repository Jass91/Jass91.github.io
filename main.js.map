<mat-form-field>
  <mat-label>{{ label }}</mat-label>
  <mat-chip-grid #itemsGrid [formControl]="control">
    @for (tag of items; track tag) {
    <mat-chip-row (removed)="removeItem(tag)">
      {{ tag }}
      <button matChipRemove>
        <mat-icon>cancel</mat-icon>
      </button>
    </mat-chip-row>
    }
  </mat-chip-grid>
  <input
    [placeholder]="placeholder"
    [matChipInputFor]="itemsGrid"
    (matChipInputTokenEnd)="addItem($event)"
  />
</mat-form-field>
