<section class="colored-container">
  <div class="container">
    <div class="content-container">
      <h1>Featured Tournaments</h1>
      <div class="card-list">
        <app-landing-page-card
          *ngFor="let t of featuredTournaments"
          [id]="t.id"
          [title]="t.title"
          [image]="t.image"
          [description]="t.description"
          (onclick)="showTournamentInfo($event)"
        />
      </div>
    </div>
  </div>
</section>
