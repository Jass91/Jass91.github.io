<div class="card" [style.width]="width ? width : 'auto'">
  <img
    class="card-img"
    [src]="image"
    style="border-radius: 10px"
    [style.cursor]="onclick ? 'pointer' : 'auto'"
    (click)="onCardClick($event)"
  />
  <div class="card-description">
    <div class="content">
      <p>{{ title }}</p>
      <p class="neutral-text-1">{{ description }}</p>
    </div>
  </div>
</div>
