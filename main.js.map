<div class="object-box">
  <ng-content select="[labelControl]"></ng-content>
  <div class="chips-container">
    @for (item of values; track item) {
    <mat-chip-row (removed)="removeItem(item)" (click)="enterEditMode(item)">
      {{ item[displayField] }}
      <button matChipRemove aria-label="'remove reactive form' + keyword">
        <mat-icon>cancel</mat-icon>
      </button>
    </mat-chip-row>
    }
  </div>
  <div class="fields-container">
    <ng-content></ng-content>
  </div>
  <div class="buttons-container">
    <button
      mat-button
      (click)="addItem()"
      [hidden]="editMode"
      [disabled]="editMode || !formGroup.valid"
    >
      Add
    </button>
    <button mat-button (click)="exitEditMode()" [hidden]="!editMode">
      Cancel
    </button>
    <button
      mat-button
      (click)="updateItem()"
      [hidden]="!editMode"
      [disabled]="!formGroup.valid"
    >
      Update
    </button>
  </div>
</div>
