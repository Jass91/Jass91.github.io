<div class="page">
  <h3>Account Binding</h3>
  <div class="action-area">
    <div class="left">
      <span>Providers</span>
      <button mat-button (click)="steamLogin()">
        <span>Bind your Steam account</span>
        <mat-icon svgIcon="steam" />
      </button>
      <button mat-button (click)="psnLogin()" disabled="">
        <span>Bind your PSN account</span>
        <mat-icon svgIcon="psn" />
      </button>
      <button mat-button (click)="xboxLogin()">
        <span>Bind your XBOX</span>
        <mat-icon svgIcon="xbox" />
        <!-- <img class="icon --gray" src="assets/icons/xbox.svg" /> -->
      </button>
      <button mat-button (click)="googleLogin()">
        <span>Bind your Google account</span>
        <mat-icon svgIcon="google" />
      </button>
    </div>
    <div class="right">
      <span>Accounts</span>
      <div class="account-list">
        <div *ngFor="let a of accounts">
          <span>{{ a.provider }}</span>
          <span>{{ a.username }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
