<section class="inverse-colored-container">
  <div class="container">
    <div class="content-container">
      <h1>Why Tournament</h1>
      <h6>
        <p>
          Thornament is designed to be a fun, flexible, and inclusive platform
          for all types of gamers. Whether you're a competitive player, a casual
          fan, or a content creator, you can find or create tournaments that
          match your interests and skill level.
        </p>
      </h6>
      <div class="card-list">
        <app-landing-page-card
          *ngFor="let r of whyTournamentReasons"
          [id]="r.id"
          [title]="r.title"
          [image]="r.image"
          [description]="r.description"
        />
      </div>
    </div>
  </div>
</section>
