<div class="page">
  <div class="form-container">
    <mat-stepper [linear]="true" #stepper>
      <mat-step [stepControl]="loginForm" label="Connect your wallet">
        <form [formGroup]="loginForm">
          <h2 class="form-title">Login with your wallet</h2>
          <div class="full-field">
            <mat-form-field>
              <input
                matInput
                [readonly]="true"
                formControlName="wallet"
                placeholder="Will be filled once you connect"
              />
              <button
                matSuffix
                mat-icon-button
                (click)="connectWallet($event)"
                style="margin-right: 10px"
              >
                <mat-icon svgIcon="metamask"></mat-icon>
              </button>
            </mat-form-field>
            <div class="button-area">
              <mat-radio-group
                aria-label="Select an profile"
                formControlName="profile"
              >
                <mat-radio-button value="Player">Player</mat-radio-button>
                <mat-radio-button value="GameOwner">Owner</mat-radio-button>
              </mat-radio-group>
              <button mat-button matStepperNext [disabled]="!loginForm.valid">
                Next
              </button>
            </div>
          </div>
        </form>
      </mat-step>
      <mat-step>
        <ng-template matStepLabel>Signature</ng-template>
        <p>You are almost done.</p>
        <p>Please we just need you to sign a message using your wallet</p>
        <div>
          <button mat-button matStepperPrevious>Back</button>
          <button mat-button (click)="onSubmit()">Sign</button>
        </div>
        <div style="margin-top: 10px" *ngIf="loginError" class="error">
          {{ loginError }}
        </div>
      </mat-step>
    </mat-stepper>
  </div>
</div>
