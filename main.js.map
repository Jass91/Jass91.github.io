<div class="section">
  <h6>About Thornament</h6>
  <p>
    Thornament is platform protocal-like that aim to allow any game to create
    and manage e-sports easily.
  </p>
</div>
<div class="section">
  <h6>Keep Connected</h6>
  <div class="media-area">
    <div class="media-item">
      <button mat-icon-button>
        <img class="icon --gray" src="assets/icons/instagram.png" />
      </button>
      <span>Instagram</span>
    </div>
    <div class="media-item">
      <button mat-icon-button>
        <img class="icon --gray" src="assets/icons/facebook.png" />
      </button>
      <span>Facebook</span>
    </div>
    <div class="media-item">
      <button mat-icon-button>
        <img class="icon --gray" src="assets/icons/twitter.png" />
      </button>
      <span>Twitter</span>
    </div>
  </div>
</div>
<div class="section">
  <h6>Contact</h6>
  <div class="media-area">
    <div class="media-item">
      <button mat-icon-button>
        <img class="icon email-icon" src="assets/icons/email.svg" />
      </button>
      <span>{{ "contact@thornament.com" }}</span>
      <button
        mat-icon-button
        (click)="copyToClipboard('contact@thornament.com')"
      >
        <img class="icon email-icon" src="assets/icons/copy.svg" />
      </button>
    </div>
  </div>
</div>
